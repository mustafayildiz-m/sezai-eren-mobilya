services:
  app:
    build: .
    container_name: sezai-eren-mobilya
    ports:
      - "8080:80"
    env_file: .env
    volumes:
      - ./:/var/www/html
      - storage:/var/www/html/storage
      - uploads:/var/www/html/public/uploads
    restart: unless-stopped
  test:
    build: .
    env_file: .env
    environment:
      DB_PATH: /tmp/test.sqlite
    volumes:
      - ./:/var/www/html
    entrypoint: ["phpunit"]
    profiles: ["test"]
volumes:
  storage:
  uploads:
